[keys]
"<C-enter>" = "park"

[actions.c]
cmd = "tmux set-buffer -w -- {root}"
mode = "run"
description = "copy project root path"

[actions.f]
cmd = "~/.local/bin/scripts/tmux-sessionizer"
mode = "window"
view = "both"
description = "tmux sessionizer"

# Temporary: release-fast build of the smelt git-status worktree.
[actions.v]
cmd = "/home/dev/dev/smelt/.worktrees/git-status/target/release-fast/smelt diff"
description = "review git changes"
