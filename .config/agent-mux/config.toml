[keys]
"<C-enter>" = "park"
"<space><space>" = "toggle-read"

[actions."<space>gd"]
cmd = "smelt diff"
description = "review git changes"

[actions."<space>gD"]
cmd = "smelt diff"
checkout = "main"
description = "review git changes in main"

[actions."<space>ff"]
cmd = "smelt files"
description = "find files"

[actions."<space>fF"]
cmd = "smelt files"
checkout = "main"
description = "find files in main"

[actions."<space>fs"]
cmd = "smelt search"
description = "search file contents"

[actions."<space>fS"]
cmd = "smelt search"
checkout = "main"
description = "search file contents in main"

[hosts.dev]
ssh = "dev@dev"

# The directories the finder (`/`, `agent-mux find`) offers to open.
[find]
roots = ["~/dev", "~/.dotfiles", "~/syncthing/vault"]
depth = 6
hidden = true
